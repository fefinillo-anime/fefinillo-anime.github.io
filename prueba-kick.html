<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba chat Kick</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #0e0e10; color: #efeff1; font-family: "Segoe UI", Roboto, Arial, sans-serif;
           display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; }
    p { max-width: 420px; font-size: 14px; line-height: 1.5; }
    iframe { width: 100%; max-width: 420px; flex: 1; border: 2px solid #1d6b12; border-radius: 6px; }
  </style>
</head>
<body>
  <p>Prueba: inicia sesión en kick.com en otra pestaña de este mismo navegador,
     recarga esta página e intenta escribir en el chat de abajo.</p>
