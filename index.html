<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte bien al móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que sale en la pestaña del navegador -->
  <title>Fefinillo · Directo</title>

  <style>
    /* ====== COLORES Y MEDIDAS (cámbialos aquí y cambia toda la página) ====== */
    :root {
      --fondo: #0e0e10;        /* negro de Twitch */
      --barra: #18181b;        /* gris oscuro de las barras */
      --borde: #2f2f35;        /* línea separadora */
      --texto: #efeff1;        /* texto claro */
      --texto-suave: #adadb8;  /* texto apagado (pestañas no elegidas) */
      --morado: #9147ff;       /* color de Twitch */
      --verde: #53fc18;        /* color de Kick (para textos) */
      --verde-oscuro: #1d6b12; /* verde de Kick más discreto (botones) */
      --ancho-chat: 340px;     /* ancho de la columna del chat */
      --alto-barra: 44px;      /* alto de la barra de abajo */
    }

    /* Quita márgenes por defecto y hace que todo ocupe la pantalla entera */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden; /* sin scroll en PC: todo cabe en pantalla */
    }

    /* ====== ESTRUCTURA: vídeo | chat  arriba,  barra abajo ====== */
    .pagina {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--ancho-chat);
      grid-template-rows: minmax(0, 1fr) var(--alto-barra);
      grid-template-areas:
        "video chat"
        "barra barra";
      height: 100vh;
      height: 100dvh; /* en móvil evita que la barra del navegador tape cosas */
    }

    /* ====== ZONA DEL VÍDEO (reproductor de Kick) ====== */
    .video { grid-area: video; background: #000; min-width: 0; min-height: 0; }
    .video iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* ====== COLUMNA DEL CHAT ====== */
    .chat {
      grid-area: chat;
      background: var(--barra);
      border-left: 1px solid var(--borde);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Pestañas de arriba: Todo | Twitch | Kick */
    .pestanas { display: flex; border-bottom: 1px solid var(--borde); }
    .pestana {
      flex: 1;
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--texto-suave);
      font: inherit;
      font-size: 13px;
      padding: 6px 0;
      cursor: pointer;
    }
    .pestana:hover { color: var(--texto); }
    .pestana.activa { color: #fff; border-bottom-color: var(--texto); }

    /* Fila "Escribo en: Twitch | Kick" (solo se ve en la pestaña Todo) */
    .selector {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-bottom: 1px solid var(--borde);
      font-size: 12px;
    }
    .selector span { color: var(--texto-suave); margin-right: 4px; white-space: nowrap; }
    .opcion {
      flex: 1;
      background: none;
      border: 0;
      border-radius: 4px;
      color: var(--texto-suave);
      font: inherit;
      padding: 2px 0;
      cursor: pointer;
    }
    .opcion.activa[data-lado="twitch"] { background: var(--morado); color: #fff; }
    .opcion.activa[data-lado="kick"]   { background: var(--verde-oscuro); color: #fff; }

    /* Cajas de los dos chats oficiales */
    .zona-chats { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .caja { display: flex; flex-direction: column; min-height: 0; }

    /* ====== RECORTE DE LOS CHATS (pestaña Todo) ======
       No podemos tocar el interior de los chats, así que los "recortamos" desde fuera:
       el marco esconde lo que sobresale por arriba (cabecera) y por abajo (caja de escribir).
       Si Twitch o Kick cambian su diseño y se ve un trozo de más o de menos,
       ajusta estos 4 números (en píxeles). */
    :root {
      --twitch-cabecera: 105px; /* cabecera "Chat del stream" + fila de "top regalos" de Twitch */
      --twitch-escribir: 100px; /* alto de la caja de escribir + fila de puntos de Twitch */
      --kick-cabecera: 80px;    /* cabecera "Chat" + barra "Regala 1 suscripción" de Kick */
      --kick-escribir: 105px;   /* alto de la caja de escribir + botón Chatear de Kick */
    }
    /* Marco de cada chat: morado para Twitch y verde para Kick,
       para que se vea dónde empieza uno y acaba el otro */
    .marco {
      flex: 1; min-height: 0; margin: 4px; padding: 2px;
      border: 2px solid; border-radius: 6px;
      display: flex; flex-direction: column;
    }
    #caja-twitch .marco { border-color: var(--morado); }
    #caja-kick .marco   { border-color: var(--verde-oscuro); }
    /* Sin recorte: el chat se ve entero, tal cual */
    .marco iframe { flex: 1; width: 100%; border: 0; display: block; }

    /* ¿Qué chats se recortan?
       - Twitch: SOLO cuando está arriba en "Todo" (solo lectura). El chat de Twitch donde se
         escribe NO se puede recortar: Twitch lo detecta y bloquea el chat a ti y a tus mods
         ("otro elemento tapa la ventana del chat").
       - Kick: siempre (cabecera y caja de escribir), porque en Kick se escribe con el botón
         "Escribir en Kick": su inicio de sesión no funciona dentro de otra página. */
    .modo-todo #caja-twitch.caja-arriba .marco { --quitar-arriba: var(--twitch-cabecera); --quitar-abajo: var(--twitch-escribir); }
    #caja-kick .marco { --quitar-arriba: var(--kick-cabecera); --quitar-abajo: var(--kick-escribir); }

    .modo-todo #caja-twitch.caja-arriba .marco,
    #caja-kick .marco { position: relative; overflow: hidden; }
    .modo-todo #caja-twitch.caja-arriba .marco iframe,
    #caja-kick .marco iframe {
      position: absolute; left: 0; width: 100%;
      top: calc(-1 * var(--quitar-arriba));
      height: calc(100% + var(--quitar-arriba) + var(--quitar-abajo));
    }

    /* ====== ESCRIBIR EN KICK DESDE LA PÁGINA ======
       Solo sale donde toca escribir en Kick (abajo en "Todo" y en la pestaña Kick). */
    .kick-escribir { display: none; margin: 0 4px 4px; }
    .modo-kick .kick-escribir,
    .modo-todo #caja-kick.caja-abajo .kick-escribir { display: block; }

    .kick-conectar {
      width: 100%; padding: 8px; border: 0; border-radius: 6px;
      background: var(--verde-oscuro); color: #fff;
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .kick-conectar:hover { filter: brightness(1.2); }
    .kick-form { display: flex; gap: 6px; }
    .kick-form[hidden], .kick-conectar[hidden] { display: none; }
    .kick-form input {
      flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px;
      border: 1px solid #3a3a44; background: #0e0e10; color: var(--texto); font: inherit; font-size: 13px;
    }
    .kick-form input:focus { outline: none; border-color: var(--verde); }
    .kick-form button {
      padding: 0 12px; border: 0; border-radius: 6px; background: var(--verde); color: #0e0e10;
      font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .kick-form button:disabled { opacity: .6; cursor: default; }
    .kick-info { font-size: 11px; color: var(--texto-suave); margin-top: 4px; min-height: 14px; }
    .kick-info a { color: var(--texto-suave); }
    .kick-info .error { color: #ff6b6b; }
    /* Etiqueta pequeña encima del chat de arriba en la pestaña Todo */
    .etiqueta { display: none; font-size: 11px; padding: 4px 8px 0; }
    #caja-twitch .etiqueta { color: #bf94ff; }
    #caja-kick .etiqueta   { color: var(--verde); }

    /* ====== QUÉ SE VE EN CADA MODO ======
       El chat elegido va abajo ocupando 2/3; el otro va arriba en 1/3.
       Los chats NO se recargan al cambiar de pestaña: solo se recolocan. */
    .modo-todo .selector { display: flex; }
    .modo-todo .caja-arriba { order: 1; flex: 1; }
    .modo-todo .caja-arriba .etiqueta { display: block; }
    .modo-todo .caja-abajo  { order: 2; flex: 2; }

    .modo-twitch #caja-twitch { flex: 1; }
    .modo-twitch #caja-kick   { display: none; }
    .modo-kick #caja-kick     { flex: 1; }
    .modo-kick #caja-twitch   { display: none; }

    /* ====== BARRA DE ABAJO CON LOS ENLACES ====== */
    .barra {
      grid-area: barra;
      background: var(--barra);
      border-top: 1px solid var(--borde);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      overflow-x: auto;      /* si no caben (móvil), se deslizan de lado */
      white-space: nowrap;
    }
    .canal {
      font-weight: 700;
      margin-right: auto;    /* empuja los botones hacia la derecha */
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Tamaño del logo en la barra (súbelo o bájalo cambiando el 32px) */
    .logo { height: 32px; width: auto; border-radius: 6px; }

    /* Estilo común de todos los botones */
    .boton {
      color: var(--texto);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--borde);
      transition: filter .15s;
      flex-shrink: 0;
    }
    .boton:hover { filter: brightness(1.3); }
    .boton.sub-twitch { background: var(--morado); color: #fff; }
    .boton.sub-kick   { background: var(--verde-oscuro); color: #fff; }

    /* ====== MÓVIL: vídeo arriba, chat debajo, barra al final ====== */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .pagina {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) var(--alto-barra);
        grid-template-areas:
          "video"
          "chat"
          "barra";
      }
      .video { aspect-ratio: 16 / 9; }  /* el vídeo mantiene su forma */
      .chat { border-left: 0; border-top: 1px solid var(--borde); }
      .canal span { display: none; }    /* en móvil solo el logo, para ganar sitio */
    }
  </style>
</head>
<body>
  <div class="pagina">

    <!-- REPRODUCTOR DE KICK: aquí se ve lo que mandas a Kick -->
    <div class="video">
      <iframe
        src="https://player.kick.com/fefinillo?autoplay=true"
        allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture"
        title="Directo de Fefinillo en Kick">
      </iframe>
    </div>

    <!-- COLUMNA DEL CHAT -->
    <div class="chat modo-todo" id="chat">

      <!-- Pestañas -->
      <div class="pestanas">
        <button class="pestana" data-modo="todo">Todo</button>
        <button class="pestana" data-modo="twitch">Twitch</button>
        <button class="pestana" data-modo="kick">Kick</button>
      </div>

      <!-- Selector de la pestaña Todo -->
      <div class="selector">
        <span>Escribo en</span>
        <button class="opcion" data-lado="twitch">Twitch</button>
        <button class="opcion" data-lado="kick">Kick</button>
      </div>

      <div class="zona-chats">
        <!-- CHAT DE TWITCH: es el chat real de tu canal (con puntos y emotes).
             "parent=" TIENE que ser el dominio exacto donde está la página, si no, no carga. -->
        <div class="caja" id="caja-twitch">
          <div class="etiqueta">Chat de Twitch</div>
          <div class="marco">
            <iframe
              src="https://www.twitch.tv/embed/fdefefinillo/chat?parent=fefinillo-anime.github.io&darkpopout"
              title="Chat de Twitch de fdefefinillo">
            </iframe>
          </div>
        </div>

        <!-- CHAT DE KICK: es el chat real de tu canal de Kick -->
        <div class="caja" id="caja-kick">
          <div class="etiqueta">Chat de Kick</div>
          <div class="marco">
            <iframe
              src="https://kick.com/popout/fefinillo/chat"
              title="Chat de Kick de Fefinillo">
            </iframe>
          </div>
          <!-- Escribir en Kick: primero "Conectar" (una sola vez), luego la caja de escribir -->
          <div class="kick-escribir">
            <button class="kick-conectar" id="kick-conectar">Conectar con Kick para escribir</button>
            <form class="kick-form" id="kick-form" hidden>
              <input id="kick-texto" maxlength="500" placeholder="Enviar un mensaje en Kick" autocomplete="off">
              <button type="submit" id="kick-enviar">Chatear</button>
            </form>
            <div class="kick-info" id="kick-info"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BARRA DE ABAJO -->
    <nav class="barra">
      <div class="canal">
        <!-- Tu logo: el archivo logo.png tiene que estar en el repositorio, junto a index.html -->
        <img class="logo" src="logo.png" alt="Logo de Fefinillo">
        <span>Fefinillo</span>
      </div>

      <!-- target="_blank" = se abre en pestaña nueva, así no se cierra el directo -->
      <a class="boton sub-twitch" href="https://www.twitch.tv/subs/fdefefinillo" target="_blank" rel="noopener">Sub en Twitch</a>
      <a class="boton sub-kick" href="https://kick.com/fefinillo" target="_blank" rel="noopener">Sub en Kick</a>
      <a class="boton" href="https://www.youtube.com/@Fefinillo" target="_blank" rel="noopener">YouTube</a>
      <a class="boton" href="https://www.youtube.com/@FdeFefinillo" target="_blank" rel="noopener">YouTube VODs</a>
      <a class="boton" href="https://x.com/fefinillo" target="_blank" rel="noopener">Twitter</a>
      <a class="boton" href="https://discord.gg/36pqc28FSh" target="_blank" rel="noopener">Discord</a>
      <a class="boton" href="https://www.instagram.com/itsmart.inz/" target="_blank" rel="noopener">Instagram</a>
      <a class="boton" href="https://www.tiktok.com/@fefinillo" target="_blank" rel="noopener">TikTok</a>
    </nav>

  </div>

  <script>
    // ====== PESTAÑAS Y SELECTOR ======
    // La página recuerda lo último que eligió cada viewer (en su propio navegador).
    const chat = document.getElementById('chat');
    const cajaTwitch = document.getElementById('caja-twitch');
    const cajaKick = document.getElementById('caja-kick');

    // Lee y guarda la elección. El try/catch evita errores si el navegador no deja guardar.
    function leer(clave, porDefecto) {
      try { return localStorage.getItem(clave) || porDefecto; } catch (e) { return porDefecto; }
    }
    function guardar(clave, valor) {
      try { localStorage.setItem(clave, valor); } catch (e) {}
    }

    let modo = leer('fefi-modo', 'todo');   // todo | twitch | kick
    let lado = leer('fefi-lado', 'twitch'); // en "Todo": dónde escribe (twitch | kick)

    function pintar() {
      // Cambia el modo de la columna
      chat.className = 'chat modo-' + modo;

      // En "Todo", el chat donde escribes va abajo (grande) y el otro arriba (pequeño)
      const abajo  = lado === 'twitch' ? cajaTwitch : cajaKick;
      const arriba = lado === 'twitch' ? cajaKick : cajaTwitch;
      abajo.classList.add('caja-abajo');    abajo.classList.remove('caja-arriba');
      arriba.classList.add('caja-arriba');  arriba.classList.remove('caja-abajo');

      // Marca la pestaña y la opción elegidas
      document.querySelectorAll('.pestana').forEach(b =>
        b.classList.toggle('activa', b.dataset.modo === modo));
      document.querySelectorAll('.opcion').forEach(b =>
        b.classList.toggle('activa', b.dataset.lado === lado));
    }

    document.querySelectorAll('.pestana').forEach(b => b.addEventListener('click', () => {
      modo = b.dataset.modo; guardar('fefi-modo', modo); pintar();
    }));
    document.querySelectorAll('.opcion').forEach(b => b.addEventListener('click', () => {
      lado = b.dataset.lado; guardar('fefi-lado', lado); pintar();
    }));

    pintar();

    // ====== ESCRIBIR EN KICK (conexión oficial con Kick) ======
    const KICK = {
      clientId: '01M6W5J7SS3QC0QAGWR6BAJYD1',                          // Client ID de tu app de Kick (no es secreto)
      servidor: 'https://fefinillo-kick.vercel.app/api/kick',          // ⬅️ tu mini servidor de Vercel
      redirect: 'https://fefinillo-anime.github.io/kick-callback.html' // igual que en la app de Kick
    };
    const kConectar = document.getElementById('kick-conectar');
    const kForm = document.getElementById('kick-form');
    const kTexto = document.getElementById('kick-texto');
    const kEnviar = document.getElementById('kick-enviar');
    const kInfo = document.getElementById('kick-info');

    // La conexión de cada viewer se guarda en su propio navegador
    function leerSesion() { try { return JSON.parse(localStorage.getItem('fefi-kick')); } catch (e) { return null; } }
    function guardarSesion(s) {
      try { s ? localStorage.setItem('fefi-kick', JSON.stringify(s)) : localStorage.removeItem('fefi-kick'); } catch (e) {}
    }

    // Muestra "Conectar" o la caja de escribir, según si el viewer está conectado
    function pintarKick(error) {
      const s = leerSesion();
      kConectar.hidden = !!s;
      kForm.hidden = !s;
      kInfo.textContent = '';
      if (error) {
        const e = document.createElement('span'); e.className = 'error'; e.textContent = error;
        kInfo.appendChild(e);
      } else if (s) {
        kInfo.append('Conectado como ');
        const b = document.createElement('b'); b.textContent = s.nombre || 'tu cuenta'; kInfo.appendChild(b);
        kInfo.append(' · ');
        const salir = document.createElement('a'); salir.href = '#'; salir.textContent = 'desconectar';
        salir.addEventListener('click', ev => { ev.preventDefault(); guardarSesion(null); pintarKick(); });
        kInfo.appendChild(salir);
      }
    }

    // Utilidades para la seguridad de la conexión (PKCE, lo exige Kick)
    function b64url(bytes) { return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function aleatorio(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

    // Botón "Conectar con Kick": abre la pantalla oficial de Kick
    kConectar.addEventListener('click', async () => {
      // La ventanita se abre YA (si se abre más tarde, el navegador la bloquea)
      const ventana = window.open('', 'kick-login', 'width=500,height=720');
      const verifier = aleatorio(48), state = aleatorio(16);
      const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
      try { localStorage.setItem('fefi-kick-pkce', JSON.stringify({ verifier, state })); } catch (e) {}
      const url = 'https://id.kick.com/oauth/authorize?' + new URLSearchParams({
        response_type: 'code', client_id: KICK.clientId, redirect_uri: KICK.redirect,
        scope: 'user:read chat:write', code_challenge: b64url(hash), code_challenge_method: 'S256', state
      });
      if (ventana) ventana.location = url; else location.href = url; // si se bloqueó la ventanita, va en esta pestaña
    });

    // Cuando la ventanita termina, guarda la conexión y esta página se entera sola
    window.addEventListener('storage', e => { if (e.key === 'fefi-kick') pintarKick(); });

    async function pedir(datos) {
      const r = await fetch(KICK.servidor, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
      });
      let j = {}; try { j = await r.json(); } catch (e) {}
      return { ok: r.ok, status: r.status, j };
    }

    // Devuelve una conexión válida, renovándola si está a punto de caducar
    async function sesionValida(forzar) {
      let s = leerSesion();
      if (!s) return null;
      if (forzar || Date.now() > s.caduca - 60000) {
        const r = await pedir({ accion: 'renovar', refresh_token: s.refresh, nombre: s.nombre });
        if (!r.ok) { guardarSesion(null); pintarKick('Tu conexión con Kick ha caducado. Vuelve a conectar.'); return null; }
        s = r.j; guardarSesion(s);
      }
      return s;
    }

    // Enviar un mensaje (botón Chatear o tecla Enter)
    kForm.addEventListener('submit', async ev => {
      ev.preventDefault();
      const texto = kTexto.value.trim();
      if (!texto) return;
      kEnviar.disabled = true;
      try {
        let s = await sesionValida(false);
        if (!s) return;
        let r = await pedir({ accion: 'enviar', token: s.access, content: texto });
        if (r.status === 401) {                 // token caducado: se renueva y se reintenta una vez
          s = await sesionValida(true);
          if (!s) return;
          r = await pedir({ accion: 'enviar', token: s.access, content: texto });
        }
        if (r.ok) { kTexto.value = ''; pintarKick(); }
        else pintarKick(r.j.error || 'No se pudo enviar el mensaje.');
      } catch (e) {
        pintarKick('No se pudo contactar con el servidor.');
      } finally {
        kEnviar.disabled = false;
        kTexto.focus();
      }
    });

    pintarKick();
  </script>
</body>
</html>
